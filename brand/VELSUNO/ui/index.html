<!doctype html><html lang="es-PE"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Velsuno · Aplicaciones de marca</title><link rel="stylesheet" href="../developer/design-tokens.css"><style>*{box-sizing:border-box}body{margin:0;padding:28px}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap}header img{width:180px}h1{font-size:24px}p{color:var(--text-secondary)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}nav button{border:1px solid var(--border-control);border-radius:12px;background:white;padding:8px 16px;cursor:pointer}nav button[aria-pressed=true]{background:var(--brand-primary);color:white}figure{margin:0;background:var(--bg-secondary);border-radius:24px;padding:16px;text-align:center}figure img{display:block;max-width:100%;height:auto;max-height:80vh;margin:auto}figcaption{padding:16px}footer{margin:20px 0}a{margin-right:24px}</style><header><img src="../logo/logo-primary.svg" alt="Velsuno"><h1>Aplicaciones de marca</h1></header><p>13 vistas de referencia. Datos ficticios; las pantallas no ejecutan operaciones financieras.</p><nav aria-label="Elegir pantalla"><button type="button" data-src="dashboard-preview.png" data-title="Resumen claro" aria-pressed="true">Resumen claro</button><button type="button" data-src="dashboard-dark-preview.png" data-title="Resumen oscuro" aria-pressed="false">Resumen oscuro</button><button type="button" data-src="dashboard-mobile-preview.png" data-title="Resumen móvil" aria-pressed="false">Resumen móvil</button><button type="button" data-src="login-preview.png" data-title="Inicio de sesión" aria-pressed="false">Inicio de sesión</button><button type="button" data-src="signup-preview.png" data-title="Crear cuenta" aria-pressed="false">Crear cuenta</button><button type="button" data-src="onboarding-preview.png" data-title="Configurar una fuente" aria-pressed="false">Configurar una fuente</button><button type="button" data-src="transactions-preview.png" data-title="Movimientos y origen" aria-pressed="false">Movimientos y origen</button><button type="button" data-src="review-preview.png" data-title="Revisar un movimiento" aria-pressed="false">Revisar un movimiento</button><button type="button" data-src="milestone-preview.png" data-title="Hito financiero" aria-pressed="false">Hito financiero</button><button type="button" data-src="pricing-preview.png" data-title="Free y Plus" aria-pressed="false">Free y Plus</button><button type="button" data-src="upgrade-preview.png" data-title="Prueba de Plus" aria-pressed="false">Prueba de Plus</button><button type="button" data-src="plus-active-preview.png" data-title="Plus activo" aria-pressed="false">Plus activo</button><button type="button" data-src="email-preview.png" data-title="Correo mensual" aria-pressed="false">Correo mensual</button></nav><figure><img id="preview" src="dashboard-preview.png" alt="Resumen claro: flujo neto de S/ 1,300 con datos parciales y dos movimientos por revisar."><figcaption id="caption">Resumen claro</figcaption></figure><footer><a href="../brandbook/Velsuno_Brand_Book_v1.0.pdf">Brand Book PDF</a><a href="../developer/README.md">Guía de implementación</a></footer><script>const buttons=[...document.querySelectorAll('nav button')];for(const b of buttons)b.addEventListener('click',()=>{for(const a of buttons)a.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','true');const im=document.getElementById('preview');im.src=b.dataset.src;im.alt=b.dataset.title+' · referencia visual de Velsuno; datos ficticios';document.getElementById('caption').textContent=b.dataset.title;});</script></html>
